name: TraceShield X quality gate

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    defaults:
      run:
        working-directory: investigation-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: investigation-app/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Syntax and static checks
        run: npm run check
      - name: Automated tests
        run: npm test
